<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu đăng ký</title>
</head>

<body>

<form>
    <table border="1"
           width="500"
           align="center"
           cellpadding="5"
           cellspacing="0"
           bgcolor="#E2EFDA">

        <tr>
            <td colspan="2" align="center">
                <header>
                    <h2 style="color: #395824; margin: 5px 0;">
                        Phiếu đăng ký tham gia chương trình khuyến mãi
                    </h2>
                </header>
            </td>
        </tr>

        <tr>
            <td width="35%">Họ và tên</td>
            <td>
                <input type="text"
                       placeholder="Họ và tên"
                       size="30">
            </td>
        </tr>

        <tr>
            <td>Địa chỉ</td>
            <td>
                <input type="text"
                       placeholder="Địa chỉ cần nhập"
                       size="25">
            </td>
        </tr>

        <tr>
            <td>Điện thoại</td>
            <td>
                <input type="text"
                       placeholder="Số điện thoại"
                       size="20">
            </td>
        </tr>

        <tr>
            <td>Phái</td>
            <td>
                <input type="radio" id="nam" name="phai" value="nam">
                <label for="nam">Nam</label>

                <input type="radio" id="nu" name="phai" value="nu">
                <label for="nu">Nữ</label>
            </td>
        </tr>

        <tr>
            <td>Nghề nghiệp</td>
            <td>
                <select>
                    <option selected>Giáo viên</option>
                    <option>Bác sĩ</option>
                    <option>Kỹ sư</option>
                    <option>Khác</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Chọn sản phẩm tham gia</td>
            <td>
                <select multiple size="4">
                    <option selected>Kem đánh răng</option>
                    <option>Bột giặt</option>
                    <option selected>Dầu gội đầu</option>
                    <option>Sữa tắm</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Số người dự đoán tham gia</td>
            <td>
                <input type="text"
                       placeholder=""
                       size="15">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Đồng ý">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <font color="red">
                    <b>Bạn đã đăng ký thành công!!!</b>
                </font>
            </td>
        </tr>

    </table>
</form>

</body>
</html>
